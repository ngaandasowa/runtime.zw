<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Runtime | Domains, Cloud & Developer Infrastructure</title>

    <meta
      name="description"
      content="Runtime is a technology platform for domains, cloud infrastructure and developer services. Search, register and manage domains today, with cloud hosting, APIs, data services, developer tools and AI automation coming soon."
    />

    <meta
      name="application-name"
      content="Runtime"
    />

    <meta
      name="author"
      content="Runtime"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="theme-color"
      content="#3120FF"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://runtime.co.zw/"
    />

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Runtime"
    />

    <meta
      property="og:title"
      content="Runtime | Domains, Cloud & Developer Infrastructure"
    />

    <meta
      property="og:description"
      content="Search, register and manage domains with Runtime. Cloud hosting, APIs, data services, developer tools and AI automation are coming soon."
    />

    <meta
      property="og:url"
      content="https://runtime.co.zw/"
    />

    <meta
      property="og:image"
      content="https://runtime.co.zw/og-image.webp"
    />

    <meta
      property="og:image:alt"
      content="Runtime - Domains, Cloud and Developer Infrastructure"
    />

    <!-- X / Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Runtime | Domains, Cloud & Developer Infrastructure"
    />

    <meta
      name="twitter:description"
      content="Search, register and manage domains today. Cloud hosting, APIs, data services, developer tools and AI automation are coming soon."
    />

    <meta
      name="twitter:image"
      content="https://runtime.co.zw/og-image.webp"
    />

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Website Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Runtime",
        "url": "https://runtime.co.zw/",
        "description": "Runtime is a technology platform for domains, cloud infrastructure and developer services. Domain registration and management are available now, with additional services coming soon."
      }
    </script>

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Runtime",
        "url": "https://runtime.co.zw/",
        "logo": "https://runtime.co.zw/favicon.svg",
        "description": "Runtime builds simple technology for domains, cloud infrastructure and developer services."
      }
    </script>
  </head>

  <body
    class="bg-[#FAFAFA] text-zinc-900 antialiased selection:bg-[#3120ff]/15 selection:text-[#3120ff]"
  >
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
